<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗智能辅助系统</title>
    <!-- PWA 独立窗口配置支持 -->
    <meta name="application-name" content="医疗智能辅助系统">
    <style>
        :root[data-theme="dark"] {
            --bg-sidebar: #171717;
            --bg-main: #212121;
            --bg-hover: #2a2a2a;
            --border-color: #2f2f2f;
            --text-main: #ececec;
            --text-muted: #8e8e8e;
            --input-bg: #2f2f2f;
            --input-border: #3f3f3f;
            --user-msg-bg: #2f2f2f;
        }
        :root[data-theme="light"] {
            --bg-sidebar: #f9f9f9;
            --bg-main: #ffffff;
            --bg-hover: #eaeaea;
            --border-color: #e5e5e5;
            --text-main: #171717;
            --text-muted: #6e6e6e;
            --input-bg: #f4f4f4;
            --input-border: #dcdcdc;
            --user-msg-bg: #f0f0f0;
        }

        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; transition: background 0.3s, color 0.3s; }

        /* 左侧边栏 */
        .sidebar { width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 12px; transition: background 0.3s, border 0.3s; }
        .sidebar-top { padding: 8px 10px; font-size: 15px; font-weight: 600; color: var(--text-main); }
        
        .new-chat-btn { margin-top: 10px; padding: 10px 12px; background-color: transparent; color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .new-chat-btn:hover { background-color: var(--bg-hover); }

        .history-section { flex: 1; margin-top: 20px; overflow-y: auto; }
        .history-title { font-size: 12px; color: var(--text-muted); padding: 4px 10px; margin-bottom: 4px; }
        .history-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: 0.2s; }
        .history-item:hover { background-color: var(--bg-hover); color: var(--text-main); }
        .history-item.active { background-color: var(--bg-hover); color: var(--text-main); }

        /* 主题选择 */
        .theme-selector { padding-top: 10px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 6px; }
        .theme-select-box { width: 100%; padding: 8px 10px; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-main); border-radius: 6px; font-size: 13px; outline: none; cursor: pointer; }

        /* 右侧主聊天区 */
        .main-content { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-main); position: relative; }
        .chat-header { padding: 14px 24px; font-size: 14px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        
        /* 聊天滚动区 */
        #chat-history { flex: 1; padding: 20px 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; max-width: 900px; width: 100%; margin: 0 auto; }
        .msg { line-height: 1.6; font-size: 15px; max-width: 85%; word-break: break-all; white-space: pre-wrap; }
        .user-msg { background-color: var(--user-msg-bg); padding: 10px 16px; border-radius: 12px; align-self: flex-end; }
        .ai-msg { background-color: transparent; color: var(--text-main); align-self: flex-start; }

        /* 底部输入框 */
        .input-area-wrapper { padding: 15px 20px 25px 20px; display: flex; justify-content: center; background: linear-gradient(to top, var(--bg-main) 80%, rgba(0,0,0,0)); }
        .input-box { width: 100%; max-width: 800px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 16px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .input-box:focus-within { border-color: var(--text-muted); }
        
        input { flex: 1; border: none; background: transparent; outline: none; font-size: 15px; color: var(--text-main); }
        input::placeholder { color: var(--text-muted); }
        
        .action-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 4px; }
        .send-btn { background-color: var(--text-main); color: var(--bg-main); border: none; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .send-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <!-- 左侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-top">
            <span>🏥 医疗辅助工作台</span>
        </div>
        
        <div class="new-chat-btn" onclick="startNewChat()">
            <span>+</span> 开启新对话
        </div>
        
        <div class="history-section">
            <div class="history-title">历史问诊记录</div>
            <div class="history-item active" onclick="loadHistoryDemo('半夜孩子发高烧应对方案')">👶 半夜孩子发高烧应对方案</div>
            <div class="history-item" onclick="loadHistoryDemo('高血压日常注意事项')">🩺 高血压日常注意事项</div>
        </div>

        <!-- 主题切换 -->
        <div class="theme-selector">
            <div class="history-title" style="padding:0;">外观主题</div>
            <select class="theme-select-box" id="themeSelect" onchange="changeTheme(this.value)">
                <option value="dark">🌙 夜间模式</option>
                <option value="light">☀️ 日间模式</option>
                <option value="system">💻 跟随系统</option>
            </select>
        </div>
    </div>

    <!-- 右侧主内容 -->
    <div class="main-content">
        <div class="chat-header">
            <span>医疗底座 A 智能专家咨询中</span>
            <span style="font-size: 12px;">Secure Backend Active</span>
        </div>
        
        <!-- 聊天记录区（已写入精确的医疗免责声明） -->
        <div id="chat-history">
            <div class="msg ai-msg">您好！我是医疗智能底座助理。请尽可能详细地描述患者的年龄、性别、既往病史以及当前的核心症状（如发病时长、具体感受等）。
⚠️ 【安全提示】：本系统为 AI 辅助分析工具，输出的结论仅供临床辅助参考，不能替代执业医师的面诊。如遇突发剧烈胸痛、呼吸困难、大出血等危急重症，请立即呼叫 120 急救！</div>
        </div>
        
        <!-- 底部输入框 -->
        <div class="input-area-wrapper">
            <div class="input-box">
                <button class="action-icon" title="附加文件">＋</button>
                <input type="text" id="user-input" placeholder="请输入患者症状、年龄或病史..." onkeypress="handleEnter(event)">
                <button class="action-icon" title="语音输入">🎤</button>
                <button class="send-btn" onclick="sendMessage()">↑</button>
            </div>
        </div>
    </div>

    <script>
        // 主题切换
        function changeTheme(theme) {
            const root = document.documentElement;
            if (theme === 'system') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
            } else {
                root.setAttribute('data-theme', theme);
            }
            localStorage.setItem('user-theme', theme);
        }

        const savedTheme = localStorage.getItem('user-theme') || 'dark';
        document.getElementById('themeSelect').value = savedTheme;
        changeTheme(savedTheme);

        // 开启新对话
        function startNewChat() {
            const chatHistory = document.getElementById('chat-history');
            chatHistory.innerHTML = `<div class="msg ai-msg">您好！我是医疗智能底座助理。请尽可能详细地描述患者的年龄、性别、既往病史以及当前的核心症状（如发病时长、具体感受等）。
⚠️ 【安全提示】：本系统为 AI 辅助分析工具，输出的结论仅供临床辅助参考，不能替代执业医师的面诊。如遇突发剧烈胸痛、呼吸困难、大出血等危急重症，请立即呼叫 120 急救！</div>`;
        }

        // 点击历史记录模拟切换
        function loadHistoryDemo(title) {
            const chatHistory = document.getElementById('chat-history');
            chatHistory.innerHTML = `
                <div class="msg user-msg">${title}</div>
                <div class="msg ai-msg">正在调阅关于“${title}”的历史存档建议：请注意保持观察，必要时请遵医嘱线下就诊。</div>
            `;
        }

        // 核心发送逻辑
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatHistory = document.getElementById('chat-history');
            const userText = inputField.value.trim();
            
            if (!userText) return;

            chatHistory.innerHTML += `<div class="msg user-msg">${userText}</div>`;
            inputField.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatHistory.innerHTML += `<div class="msg ai-msg" id="${loadingId}">正在分析临床特征...</div>`;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: userText }) 
                });

                const data = await response.json();
                
                if(data.answer) {
                    document.getElementById(loadingId).innerText = data.answer;
                } else {
                    document.getElementById(loadingId).innerText = "❌ 抱歉，服务器响应异常。";
                }
            } catch (error) {
                document.getElementById(loadingId).innerText = "❌ 网络连接错误，请检查。";
            }
            
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
