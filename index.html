<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗智能辅助系统 - 独立工作台</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; height: 100vh; display: flex; overflow: hidden; }

        /* 左侧边栏 */
        .sidebar { width: 260px; background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; border-right: 1px solid #1e293b; }
        .sidebar-header { padding: 20px; font-size: 16px; font-weight: bold; border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 10px; }
        .new-chat-btn { margin: 15px; padding: 10px; background-color: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; cursor: pointer; text-align: center; font-size: 14px; transition: 0.2s; }
        .new-chat-btn:hover { background-color: #334155; }
        .history-list { flex: 1; padding: 10px 15px; overflow-y: auto; font-size: 14px; color: #94a3b8; }
        .history-item { padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 5px; background: #1e293b; color: #f8fafc; }

        /* 右侧主聊天区 */
        .main-content { flex: 1; display: flex; flex-direction: column; background-color: #ffffff; height: 100vh; }
        .chat-header { padding: 15px 25px; border-bottom: 1px solid #e2e8f0; font-size: 16px; font-weight: 600; color: #0f172a; background: #ffffff; display: flex; align-items: center; justify-content: space-between; }
        
        #chat-history { flex: 1; padding: 25px; overflow-y: auto; background-color: #f8fafc; display: flex; flex-direction: column; gap: 20px; }
        
        .msg { max-width: 75%; padding: 14px 18px; border-radius: 12px; line-height: 1.6; font-size: 15px; word-break: break-all; }
        .user-msg { background-color: #0f172a; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background-color: #ffffff; color: #1e293b; align-self: flex-start; border: 1px solid #e2e8f0; border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }

        /* 底部输入框区 */
        .input-area-wrapper { padding: 20px 25px; background-color: #ffffff; border-top: 1px solid #e2e8f0; }
        .input-box { display: flex; align-items: center; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 8px 15px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.02); }
        .input-box:focus-within { border-color: #0f172a; background: #ffffff; }
        
        input { flex: 1; border: none; background: transparent; outline: none; font-size: 15px; padding: 8px; color: #0f172a; }
        button { background-color: #0f172a; color: white; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-weight: 500; font-size: 14px; transition: 0.2s; }
        button:hover { background-color: #1e293b; }
    </style>
</head>
<body>

    <!-- 左侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <span>🏥</span> 医疗智能工作台
        </div>
        <div class="new-chat-btn" onclick="location.reload()">+ 开启新对话</div>
        <div class="history-list">
            <div style="font-size: 12px; color: #64748b; margin-bottom: 8px; padding-left: 5px;">历史会话</div>
            <div class="history-item">当前会话：医疗辅助问诊</div>
        </div>
    </div>

    <!-- 右侧主内容 -->
    <div class="main-content">
        <div class="chat-header">
            <span>医疗底座 A (独立定制版)</span>
            <span style="font-size: 13px; color: #64748b; font-weight: normal;">Secure Backend Mode</span>
        </div>
        
        <!-- 聊天记录滚动区 -->
        <div id="chat-history">
            <div class="msg ai-msg">您好！我是医疗智能底座助理。请尽可能详细地描述患者的年龄、性别、既往病史以及当前的核心症状。</div>
        </div>
        
        <!-- 底部输入框 -->
        <div class="input-area-wrapper">
            <div class="input-box">
                <input type="text" id="user-input" placeholder="输入您想咨询的医疗问题..." onkeypress="handleEnter(event)">
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatHistory = document.getElementById('chat-history');
            const userText = inputField.value.trim();
            
            if (!userText) return;

            // 1. 渲染用户消息
            chatHistory.innerHTML += `<div class="msg user-msg">${userText}</div>`;
            inputField.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // 2. 渲染加载占位符
            const loadingId = 'loading-' + Date.now();
            chatHistory.innerHTML += `<div class="msg ai-msg" id="${loadingId}">正在分析医学特征，请稍候...</div>`;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // 3. 安全请求 Vercel 后端
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: userText }) 
                });

                const data = await response.json();
                
                if(data.answer) {
                    document.getElementById(loadingId).innerText = data.answer;
                } else {
                    document.getElementById(loadingId).innerText = "❌ 抱歉，服务器响应异常。";
                }
            } catch (error) {
                document.getElementById(loadingId).innerText = "❌ 网络连接错误，请检查。";
            }
            
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
