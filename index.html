<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的医疗智能底座</title>
    <style>
        /* 这里是你自己掌控的网页样式，可以随便改颜色和大小 */
        body { font-family: sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        #chat-container { width: 100%; max-width: 600px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; display: flex; flex-direction: column; height: 80vh; }
        .header { background: #0F172A; color: white; padding: 20px; text-align: center; margin: 0; font-size: 18px; }
        #chat-history { flex: 1; padding: 20px; overflow-y: auto; background: #fafafa; }
        .msg { margin-bottom: 15px; padding: 12px 16px; border-radius: 8px; line-height: 1.5; font-size: 15px; max-width: 80%; }
        .user-msg { background: #0F172A; color: white; margin-left: auto; border-bottom-right-radius: 0; }
        .ai-msg { background: #e2e8f0; color: #1e293b; margin-right: auto; border-bottom-left-radius: 0; }
        .input-area { display: flex; padding: 15px; background: white; border-top: 1px solid #eee; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; outline: none; font-size: 15px; }
        button { margin-left: 10px; padding: 0 20px; background: #0F172A; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; transition: 0.2s; }
        button:hover { background: #1e293b; }
    </style>
</head>
<body>

    <div id="chat-container">
        <h3 class="header">🏥 医疗智能辅助系统</h3>
        
        <!-- 这里是聊天记录显示区 -->
        <div id="chat-history">
            <div class="msg ai-msg">您好！我是医疗智能底座助理。请尽可能详细地描述患者的年龄、性别、既往病史以及当前的核心症状。</div>
        </div>
        
        <!-- 这里是输入框和发送按钮 -->
        <div class="input-area">
            <input type="text" id="user-input" placeholder="请输入您的问题..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        // 👇 ⚠️ 请把第一步复制的 API Key 粘贴在下面引号里替换掉 YOUR_API_KEY
        const API_KEY = 'app-6agp0oMMETc4jrBceVyf1lPd'; 

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatHistory = document.getElementById('chat-history');
            const userText = inputField.value.trim();
            
            if (!userText) return;

            // 1. 把用户发的话显示在界面上
            chatHistory.innerHTML += `<div class="msg user-msg">${userText}</div>`;
            inputField.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // 2. 显示一个“正在思考”的占位符
            const loadingId = 'loading-' + Date.now();
            chatHistory.innerHTML += `<div class="msg ai-msg" id="${loadingId}">正在分析，请稍候...</div>`;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // 3. 通过 API 把问题偷偷发给 Dify
            try {
                const response = await fetch('https://api.dify.ai/v1/chat-messages', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        inputs: {},
                        query: userText,
                        response_mode: "blocking",
                        conversation_id: "",
                        user: "github-visitor" 
                    })
                });

                const data = await response.json();
                
                // 4. 收到 Dify 的回答后，替换掉“正在思考”
                if(data.answer) {
                    document.getElementById(loadingId).innerText = data.answer;
                } else {
                    document.getElementById(loadingId).innerText = "❌ 抱歉，连接服务器失败。";
                }
            } catch (error) {
                document.getElementById(loadingId).innerText = "❌ 网络错误，请检查设置。";
            }
            
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // 让回车键也能发送消息
        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
