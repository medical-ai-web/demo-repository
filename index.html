<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗智能辅助系统</title>
    <meta name="application-name" content="医疗智能辅助系统">
    <style>
        :root[data-theme="dark"] {
            --bg-sidebar: #171717;
            --bg-main: #212121;
            --bg-hover: #2a2a2a;
            --border-color: #2f2f2f;
            --text-main: #ececec;
            --text-muted: #8e8e8e;
            --input-bg: #2f2f2f;
            --input-border: #3f3f3f;
            --user-msg-bg: #2f2f2f;
            --menu-bg: #2b2b2b;
            --menu-hover: #383838;
            --danger-color: #f87171;
        }
        :root[data-theme="light"] {
            --bg-sidebar: #f9f9f9;
            --bg-main: #ffffff;
            --bg-hover: #eaeaea;
            --border-color: #e5e5e5;
            --text-main: #171717;
            --text-muted: #6e6e6e;
            --input-bg: #f4f4f4;
            --input-border: #dcdcdc;
            --user-msg-bg: #f0f0f0;
            --menu-bg: #ffffff;
            --menu-hover: #f0f0f0;
            --danger-color: #dc2626;
        }

        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; transition: background 0.3s, color 0.3s; }

        .sidebar { width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 14px; position: relative; z-index: 10; }
        
        .sidebar-top { display: flex; align-items: center; gap: 10px; padding: 8px 6px; margin-bottom: 8px; }
        .brand-icon-box { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #7dd3fc 0%, #86efac 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(125, 211, 252, 0.2); flex-shrink: 0; }
        .brand-info { display: flex; flex-direction: column; }
        .brand-title { font-size: 14px; font-weight: 600; color: var(--text-main); letter-spacing: 0.2px; }
        .brand-subtitle { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
        
        .status-dot { width: 7px; height: 7px; background-color: #10b981; border-radius: 50%; display: inline-block; box-shadow: 0 0 6px #10b981; animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 10px #10b981; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        
        .new-chat-btn { margin-top: 6px; padding: 10px 12px; background-color: transparent; color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .new-chat-btn:hover { background-color: var(--bg-hover); }

        .history-section { flex: 1; margin-top: 10px; overflow-y: auto; overflow-x: hidden; }
        .section-title { font-size: 12px; color: var(--text-muted); padding: 6px 8px; margin-top: 6px; }
        
        .history-item { position: relative; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; transition: 0.2s; margin-bottom: 2px; }
        .history-item:hover { background-color: var(--bg-hover); color: var(--text-main); }
        .history-item.active { background-color: var(--bg-hover); color: var(--text-main); }
        .history-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; padding-right: 5px; }
        
        .item-actions { display: flex; align-items: center; gap: 2px; opacity: 0; transition: 0.2s; flex-shrink: 0; }
        .history-item:hover .item-actions { opacity: 1; }
        
        .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .action-btn:hover { background: var(--border-color); color: var(--text-main); }
        .action-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* 🌟 全局固定定位悬浮菜单（加入 stopPropagation 防止误关闭） */
        .action-menu { position: fixed; width: 160px; background-color: var(--menu-bg); border: 1px solid var(--border-color); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 99999; display: none; padding: 6px; }
        .action-menu.show { display: block; }
        .menu-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px; color: var(--text-main); border-radius: 6px; cursor: pointer; transition: 0.15s; }
        .menu-item:hover { background-color: var(--menu-hover); }
        .menu-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .menu-divider { height: 1px; background-color: var(--border-color); margin: 4px 0; }
        .menu-item.danger { color: var(--danger-color); }
        .menu-item.danger:hover { background-color: rgba(248, 113, 113, 0.1); }

        .theme-selector { padding-top: 10px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 6px; }
        .theme-select-box { width: 100%; padding: 8px 10px; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-main); border-radius: 6px; font-size: 13px; outline: none; cursor: pointer; }

        .main-content { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-main); position: relative; }
        .chat-header { padding: 14px 24px; font-size: 13px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
        
        #chat-history { flex: 1; padding: 20px 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; max-width: 900px; width: 100%; margin: 0 auto; }
        .msg { line-height: 1.6; font-size: 15px; max-width: 85%; word-break: break-all; white-space: pre-wrap; }
        .user-msg { background-color: var(--user-msg-bg); padding: 10px 16px; border-radius: 12px; align-self: flex-end; }
        .ai-msg { background-color: transparent; color: var(--text-main); align-self: flex-start; }

        .input-area-wrapper { padding: 15px 20px 25px 20px; display: flex; justify-content: center; background: linear-gradient(to top, var(--bg-main) 80%, rgba(0,0,0,0)); }
        .input-box { width: 100%; max-width: 800px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 16px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .input-box:focus-within { border-color: var(--text-muted); }
        
        input { flex: 1; border: none; background: transparent; outline: none; font-size: 15px; color: var(--text-main); }
        input::placeholder { color: var(--text-muted); }
        
        .action-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 4px; }
        .send-btn { background-color: var(--text-main); color: var(--bg-main); border: none; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .send-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <div class="brand-icon-box">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"></path>
                </svg>
            </div>
            <div class="brand-info">
                <span class="brand-title">医疗智能辅助系统</span>
                <span class="brand-subtitle"><span class="status-dot"></span>系统运行正常</span>
            </div>
        </div>
        
        <div class="new-chat-btn" onclick="startNewChat()">
            <span>+</span> 开启新对话
        </div>
        
        <div class="history-section">
            <div class="section-title">已置顶</div>
            <div id="pinned-container">
                <div class="history-item" id="item-1" onclick="loadHistoryItem('半夜孩子发高烧应对方案', event)">
                    <span class="history-text">半夜孩子发高烧应对方案</span>
                    <div class="item-actions">
                        <button class="action-btn pin-btn" title="取消置顶" onclick="togglePin('item-1', event)"><svg viewBox="0 0 24 24"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg></button>
                        <button class="action-btn" title="更多" onclick="toggleMenu(event, 'item-1')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
                    </div>
                </div>
            </div>

            <div class="section-title">最近</div>
            <div id="recent-container">
                <div class="history-item active" id="item-2" onclick="loadHistoryItem('高血压日常注意事项', event)">
                    <span class="history-text">高血压日常注意事项</span>
                    <div class="item-actions">
                        <button class="action-btn pin-btn" title="置顶" onclick="togglePin('item-2', event)"><svg viewBox="0 0 24 24"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg></button>
                        <button class="action-btn" title="更多" onclick="toggleMenu(event, 'item-2')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="theme-selector">
            <div class="section-title" style="padding:0;">外观主题</div>
            <select class="theme-select-box" id="themeSelect" onchange="changeTheme(this.value)">
                <option value="dark">🌙 夜间模式</option>
                <option value="light">☀️ 日间模式</option>
                <option value="system">💻 跟随系统</option>
            </select>
        </div>
    </div>

    <!-- 🌟 全局唯一悬浮菜单（加入 onclick="event.stopPropagation()" 防止点击穿透关闭） -->
    <div class="action-menu" id="globalMenu" onclick="event.stopPropagation()">
        <div class="menu-item" onclick="handleMenuAction('分享')"><svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>分享</div>
        <div class="menu-item" onclick="handleMenuAction('重命名')"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>重命名</div>
        <div class="menu-divider"></div>
        <div class="menu-item" onclick="handleMenuAction('置顶切换')"><svg viewBox="0 0 24 24"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg><span id="menuPinText">置顶聊天</span></div>
        <div class="menu-item" onclick="handleMenuAction('归档')"><svg viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>归档</div>
        <div class="menu-item danger" onclick="handleMenuAction('删除')"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>删除</div>
    </div>

    <div class="main-content">
        <div class="chat-header">
            <span id="header-title">医疗底座 A 智能专家咨询中</span>
            <span style="font-size: 11px; opacity: 0.8;">Secure Backend Active</span>
        </div>
        
        <div id="chat-history">
            <div class="msg ai-msg">您好！我是医疗智能底座助理。请尽可能详细地描述患者的年龄、性别、既往病史以及当前的核心症状（如发病时长、具体感受等）。
【安全提示】：本系统为 AI 辅助分析工具，输出的结论仅供临床辅助参考，不能替代执业医师的面诊。如遇突发剧烈胸痛、呼吸困难、大出血等危急重症，请立即呼叫 120 急救！</div>
        </div>
        
        <div class="input-area-wrapper">
            <div class="input-box">
                <button class="action-icon" title="附加文件">＋</button>
                <input type="text" id="user-input" placeholder="请输入患者症状、年龄或病史..." onkeypress="handleEnter(event)">
                <button class="action-icon" title="语音输入">🎤</button>
                <button class="send-btn" onclick="sendMessage()">↑</button>
            </div>
        </div>
    </div>

    <script>
        let currentActiveItemId = null;

        function changeTheme(theme) {
            const root = document.documentElement;
            if (theme === 'system') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
            } else {
                root.setAttribute('data-theme', theme);
            }
            localStorage.setItem('user-theme', theme);
        }

        const savedTheme = localStorage.getItem('user-theme') || 'dark';
        document.getElementById('themeSelect').value = savedTheme;
        changeTheme(savedTheme);

        // 切换悬浮菜单显示状态
        function toggleMenu(event, itemId) {
            event.stopPropagation();
            currentActiveItemId = itemId;
            const menu = document.getElementById('globalMenu');
            const btn = event.currentTarget;
            const rect = btn.getBoundingClientRect();
            
            const item = document.getElementById(itemId);
            const isPinned = item.parentElement.id === 'pinned-container';
            document.getElementById('menuPinText').innerText = isPinned ? '取消置顶' : '置顶聊天';

            menu.style.top = rect.top + 'px';
            menu.style.left = (rect.right + 6) + 'px';
            menu.classList.toggle('show');
        }

        // 点击页面空白处关闭菜单
        window.addEventListener('click', () => {
            document.getElementById('globalMenu').classList.remove('show');
        });

        // 置顶 / 取消置顶切换核心逻辑
        function togglePin(itemId, event) {
            if (event) event.stopPropagation();
            document.getElementById('globalMenu').classList.remove('show');
            
            const item = document.getElementById(itemId);
            if (!item) return;
            const pinnedContainer = document.getElementById('pinned-container');
            const recentContainer = document.getElementById('recent-container');
            const pinBtn = item.querySelector('.pin-btn');

            if (item.parentElement === pinnedContainer) {
                recentContainer.appendChild(item);
                if (pinBtn) pinBtn.title = "置顶";
            } else {
                pinnedContainer.appendChild(item);
                if (pinBtn) pinBtn.title = "取消置顶";
            }
        }

        // 下拉菜单项点击分发
        function handleMenuAction(actionName) {
            const menu = document.getElementById('globalMenu');
            menu.classList.remove('show');
            
            if (!currentActiveItemId) return;
            const itemElement = document.getElementById(currentActiveItemId);
            if (!itemElement) return;
            const textElement = itemElement.querySelector('.history-text');

            if (actionName === '删除') {
                itemElement.style.transition = '0.3s';
                itemElement.style.opacity = '0';
                setTimeout(() => itemElement.remove(), 300);
            } else if (actionName === '重命名') {
                const currentName = textElement.innerText;
                const newName = prompt('请输入新的会话名称：', currentName);
                if (newName) {
                    textElement.innerText = newName;
                }
            } else if (actionName === '分享') {
                navigator.clipboard.writeText(window.location.href);
            } else if (actionName === '归档') {
                itemElement.style.opacity = '0.4';
            } else if (actionName === '置顶切换') {
                togglePin(currentActiveItemId);
            }
        }

        // 开启新对话
        function startNewChat() {
            const chatHistory = document.getElementById('chat-history');
            chatHistory.innerHTML = `<div class="msg ai-msg">您好！我是医疗智能底座助理。请尽可能详细地描述患者的年龄、性别、既往病史以及当前的核心症状（如发病时长、具体感受等）。
【安全提示】：本系统为 AI 辅助分析工具，输出的结论仅供临床辅助参考，不能替代执业医师的面诊。如遇突发剧烈胸痛、呼吸困难、大出血等危急重症，请立即呼叫 120 急救！</div>`;
            
            document.getElementById('header-title').innerText = "新对话 - 医疗智能辅助系统";

            const recentContainer = document.getElementById('recent-container');
            const newId = 'item-' + Date.now();
            
            document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));

            const newItem = document.createElement('div');
            newItem.className = 'history-item active';
            newItem.id = newId;
            newItem.onclick = function(e) { loadHistoryItem('新医疗咨询会话', e); };
            newItem.innerHTML = `
                <span class="history-text">新医疗咨询会话</span>
                <div class="item-actions">
                    <button class="action-btn pin-btn" title="置顶" onclick="togglePin('${newId}', event)"><svg viewBox="0 0 24 24"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg></button>
                    <button class="action-btn" title="更多" onclick="toggleMenu(event, '${newId}')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
                </div>
            `;
            recentContainer.prepend(newItem);
        }

        function loadHistoryItem(title, event) {
            if (event && event.target.closest('.item-actions')) return;

            document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
            const clickedItem = event.currentTarget;
            if (clickedItem) clickedItem.classList.add('active');

            document.getElementById('header-title').innerText = title + " - 咨询中";

            const chatHistory = document.getElementById('chat-history');
            chatHistory.innerHTML = `
                <div class="msg user-msg">${title}</div>
                <div class="msg ai-msg">正在调阅关于“${title}”的历史存档建议：请注意保持观察，必要时请遵医嘱线下就诊。</div>
            `;
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatHistory = document.getElementById('chat-history');
            const userText = inputField.value.trim();
            
            if (!userText) return;

            chatHistory.innerHTML += `<div class="msg user-msg">${userText}</div>`;
            inputField.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatHistory.innerHTML += `<div class="msg ai-msg" id="${loadingId}">正在分析临床特征...</div>`;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: userText }) 
                });

                const data = await response.json();
                let cleanAnswer = data.answer ? data.answer.replace(/[\*\_#]/g, '') : "❌ 抱歉，服务器响应异常。";
                document.getElementById(loadingId).innerText = cleanAnswer;
            } catch (error) {
                document.getElementById(loadingId).innerText = "❌ 网络连接错误，请检查。";
            }
            
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
